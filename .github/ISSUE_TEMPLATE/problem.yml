name: Something does not work
description: The fan control does not do what it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        On an appliance with os-xgs-npu, **XGS Coprocessor - Problem Reports** may have filed this already, cleaned of addresses and serial numbers. Pasting by hand? Take out addresses, MAC addresses, serial numbers and host names first, and never attach a configuration backup.
  - type: dropdown
    id: appliance
    attributes:
      label: Appliance
      options:
        - Sophos XGS 136
        - Sophos XGS 3300
        - Sophos XG (an older model)
        - Another machine
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version installed, and the OPNsense version.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: The steps, if you know them. "It happened once" is an answer too.
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: The lines around the time, cleaned first.
      render: text
