name: An idea or a request
description: Something the fan control could do.
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What it would let you do, and how you manage without it today.
    validations:
      required: true
