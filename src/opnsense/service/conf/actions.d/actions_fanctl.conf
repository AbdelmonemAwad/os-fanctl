# The service, and the five questions the settings page asks that a service has no answer for.
#
# start, restart, reload and stop all carry the "one" prefix, and stop carries it for a harder
# reason than the rest. That prefix tells rc.subr to do as it is asked without first consulting
# the switch in /usr/local/etc/rc.conf.d/fanctl.
#
# Coming from the page, the decision has already been made somewhere better: the framework's
# service controller reads general.enabled out of config.xml and only ever asks for a start when
# fan control is turned on. Asking rc.subr to make the same decision again, from a file that is a
# copy of that one, is how the two come to disagree.
#
# Going the other way it is not a nicety. The page can turn fan control off and then ask for a
# stop, and a plain stop would by then be looking at a service it has been told is disabled -
# rc.subr declines those. The daemon would be left running, holding a fan at a duty, with the
# button that would have handed it back now refusing to work. A stop has to stop, and a stop here
# ends in a restore.

[start]
command:/usr/local/etc/rc.d/fanctl onestart
parameters:
type:script
message:starting fan control

[stop]
command:/usr/local/etc/rc.d/fanctl onestop
parameters:
type:script
message:stopping fan control and handing the fans back

[restart]
command:/usr/local/etc/rc.d/fanctl onerestart
parameters:
type:script
message:restarting fan control

# A restart under another name. The daemon reads its settings once, at start - the curve, the
# floor, the interval and which channels it may touch are all decided before the first write - so
# there is nothing a reload could do in place, and a control loop that changed its own rules while
# holding a fan at a duty chosen under the old ones is not a thing to want. It is here because the
# framework's own service controller reaches for it when a caller asks it not to force a restart.
[reload]
command:/usr/local/etc/rc.d/fanctl onereload
parameters:
type:script
message:reloading fan control

# errors:no because the rc script exits 1 when the service is not running, as every rc script
# does, and configd throws a script's output away when it exits non-zero and answers "Execute
# error" instead. The output is the entire point of asking: the GUI reads this one line to decide
# between running, stopped and disabled - and this script's not-running line is also where an
# incident is announced, which is the one state in this plugin a human has to act on.
[status]
command:/usr/local/etc/rc.d/fanctl status
parameters:
errors:no
type:script_output
message:reading the fan control service status

# The switch /etc/rc reads at boot, in /usr/local/etc/rc.conf.d/fanctl. These two are rc.subr's
# own enable and disable, which edit that file in place, so the plugin needs no template of its
# own and there is exactly one file where "this machine runs fan control" is written down.
[enable]
command:/usr/local/etc/rc.d/fanctl enable
parameters:
type:script
message:starting fan control at boot

[disable]
command:/usr/local/etc/rc.d/fanctl disable
parameters:
type:script
message:no longer starting fan control at boot

# Hand the fans back to the hardware, now. Its own action because it must be reachable when
# everything else has failed: with the service stopped, with the daemon killed, with the page
# showing an incident. It writes back the mode and the duty each channel was found under before
# this plugin touched it, and it does nothing at all when this plugin was never driving anything.
#
# Not errors:no. A restore that failed is the one refusal in this plugin that must arrive as a
# failure and not as a line of text somebody might skim past.
[restore]
command:/usr/local/etc/rc.d/fanctl restore
parameters:
type:script
message:handing the fans back to the hardware

# What chip is in this machine, what the appliance table says about it, and whether the two agree.
# Reads only: no port is written, nothing is loaded, and no fan changes. That is what makes it the
# first thing the page asks for on hardware nobody has ever confirmed.
#
# errors:no for the same reason as [status]. A refusal - no hardware layer, a chip that does not
# match the table, a machine with no fan controller at all - is exactly what the asker needs, and
# it arrives with a non-zero exit.
[probe]
command:/usr/local/opnsense/scripts/fanctl/fanctl.py probe
parameters:
errors:no
type:script_output
message:probing the fan controller

# The live picture: every fan, its speed, the temperature each decision came from, and the safety
# contract line by line. Where the daemon is running this is its own document, written by the
# process that made the decisions - not a second reading taken by the page, which would mean two
# processes talking to one chip through two ports with no lock between them and the kernel.
[state]
command:/usr/local/opnsense/scripts/fanctl/fanctl.py status
parameters:
errors:no
type:script_output
message:reading the fan control state

# Hold one channel at one duty for a few seconds and then give it back. The floor is enforced:
# this is somebody choosing a fan speed, not measuring one.
#
# Three parameters, in the order the script takes them: channel, percent, seconds. configd quotes
# each of them and fills a %s the caller left out with an empty string, and the script reads an
# empty seconds as its own default rather than as a mistake.
[set]
command:/usr/local/opnsense/scripts/fanctl/fanctl.py set
parameters:%s %s %s
errors:no
type:script_output
message:holding a fan at a chosen duty

# The floor test, and the one place in this plugin where the floor rule is suspended - because
# measuring the duty at which a fan stops is the only job that requires going below it. It watches
# the tachometer while it runs and ends the moment the fan stops, so the measurement costs the
# machine one stopped fan for a few seconds rather than for the whole test, and it hands the fan
# back whatever happens: at the end, on the fan stopping, on a signal, and on the watchdog.
#
# It refuses while the service is running. The daemon owns the chip, and two writers on the same
# two ports with nothing to serialise them against the kernel is the race this whole plugin is
# arranged around.
[test]
command:/usr/local/opnsense/scripts/fanctl/fanctl.py test
parameters:%s %s %s
errors:no
type:script_output
message:measuring the duty at which a fan stops

# The history's own summary: every sensor and every fan, over the last hour, day, week and month,
# with the minimum, the maximum, the time-weighted mean and the seconds spent above each rung of
# a fixed temperature ladder - and the one statistic this plugin exists to be able to state, which
# is how many degrees this chassis gives back for more fan.
#
# Read from a document the sampler wrote, not recomputed here. The same reason [state] gives:
# recomputing it would mean a second process reading this chip through the same two ports while
# the first one is writing to them. This one does not read the chip at all.
#
# errors:no because "nothing has been recorded yet" is the honest answer on the first minute after
# an installation, and it arrives with a non-zero exit.
[trend]
command:/usr/local/opnsense/scripts/fanctl/history.py trend
parameters:
errors:no
type:script_output
message:reading the fan and temperature history

# One ring, raw, for the graph. The parameter is which: live, fine, hour or day. The page asks for
# one and gets one - it never loads the whole record, which on a machine that has been up a year
# is half a megabyte across four files.
[history]
command:/usr/local/opnsense/scripts/fanctl/history.py show
parameters:%s
errors:no
type:script_output
message:reading one fan history ring

# Take a sample now. Here so that somebody who has just changed something does not have to wait
# out the minute to see it land, and so that the cron line can be tested by hand. It records a
# sample only if one is due, and it does nothing at all while the fan-control daemon is running,
# because the daemon is already sampling and two readers of this chip is the one thing this plugin
# is arranged to avoid.
[sample]
command:/usr/local/opnsense/scripts/fanctl/history.py sample
parameters:
errors:no
type:script_output
message:recording one fan history sample
